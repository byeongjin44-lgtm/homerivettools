name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Calculator CLI works
        run: npm run calc -- '{"calculator":"paint-calculator"}'
      - name: Built pages show the worked examples
        run: |
          set -e
          check() { grep -q "$2" "out/$1.html" || { echo "out/$1.html is missing: $2"; exit 1; }; }
          check paint-calculator "3 gallons"
          check concrete-calculator "56 bags"
          check tile-calculator "12 boxes"
          check flooring-calculator "10 boxes"
          check mulch-calculator "25 bags"
          check square-footage-calculator "120 sq ft"
          check wallpaper-calculator "10 double rolls"
          check gravel-calculator "2.59 tons"
          check deck-board-calculator "26 boards"
          check insulation-calculator "13 packages"
          test -f out/ads.txt && test -f out/sitemap.xml && test -f out/robots.txt
          grep -q "homerivettools.com/paint-calculator" out/sitemap.xml
      - name: Share-preview images are built and linked
        run: |
          set -e
          png() { test -s "out/og/$1.png" && head -c 8 "out/og/$1.png" | od -An -c | grep -q "P   N   G" || { echo "out/og/$1.png is missing or not a PNG"; exit 1; }; }
          meta() { grep -q "og:image\" content=\"https://homerivettools.com/og/$2.png" "out/$1.html" || { echo "out/$1.html does not use og/$2.png"; exit 1; }; }
          png home
          png paint-calculator
          meta paint-calculator paint-calculator
          meta about home
          meta index home
          post=$(grep -L "\"published\": *\"$(date -u -d tomorrow +%F)\"" content/blog/*.json | head -1 | xargs basename | sed 's/\.json$//')
          png "blog-$post"
          meta "blog/$post" "blog-$post"
          ls out/og
      - name: Pinterest images are built
        run: |
          set -e
          png() { test -s "out/pin/$1.png" && head -c 8 "out/pin/$1.png" | od -An -c | grep -q "P   N   G" || { echo "out/pin/$1.png is missing or not a PNG"; exit 1; }; }
          png paint-calculator
          today=$(date -u +%F)
          for f in content/blog/*.json; do
            published=$(grep -o '"published": *"[0-9-]*"' "$f" | grep -o '[0-9-]\{10\}')
            # Posts dated in the future are not built yet (see getAllPosts).
            [[ "$published" > "$today" ]] && continue
            png "blog-$(basename "$f" .json)"
          done
          ls out/pin
          ls out
      # Cloudflare's own GitHub trigger did not fire for pushes after the first deploy, so CI asks
      # Cloudflare to deploy main once every check has passed (Pages deploy hook, stored as a secret).
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          # Tolerate spaces, line breaks or quotes pasted along with the URL.
          HOOK=$(printf '%s' "$HOOK" | tr -d '[:space:]"'"'")
          if [ -z "$HOOK" ]; then echo "::warning::CLOUDFLARE_DEPLOY_HOOK secret is not set; skipping deploy"; exit 0; fi
          case "$HOOK" in
            https://api.cloudflare.com/*) ;;
            *) echo "::error::CLOUDFLARE_DEPLOY_HOOK must be the https://api.cloudflare.com/... deploy hook URL (starts with: ${HOOK:0:12})"; exit 1 ;;
          esac
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Cloudflare deploy requested"
