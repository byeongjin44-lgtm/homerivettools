name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Calculator CLI works
        run: npm run calc -- '{"calculator":"paint-calculator"}'
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          retention-days: 3
